<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTP 개발자모드</title>
<style>
  body { width: 280px; font-family: -apple-system, "Segoe UI", sans-serif; padding: 12px; margin: 0; }
  h1 { font-size: 13px; margin: 0 0 8px; color: #333; }
  button { display: block; width: 100%; padding: 8px 10px; margin-bottom: 6px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; font-size: 12px; text-align: left; cursor: pointer; }
  button:hover { background: #f3f4f6; }
  button.primary { background: #14b8a6; color: #fff; border-color: #14b8a6; }
  button.primary:hover { background: #0d9488; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 11px; color: #6b7280; margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
  #status.error { color: #e11d48; }
  #status.ok { color: #0d9488; }
</style>
</head>
<body>
  <h1>🧩 PTP 개발자 모드 - 확장 프로그램</h1>
  <button type="button" id="btn-profile">🧭 보조 - 몰 구조분석</button>
  <button type="button" id="btn-current-category">📍 보조 - 현재 카테고리 가져오기</button>
  <button type="button" id="btn-preview">🔍 스크랩 미리보기 - (카테선택)</button>
  <button type="button" id="btn-start" class="primary">🔄 스크랩 시작</button>
  <button type="button" id="btn-picker">🎯 보조 - 스크랩 대상 직접지정</button>
  <div id="status"></div>
  <script src="actions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
